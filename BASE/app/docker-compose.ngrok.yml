services:
  api:
    environment:
      CORS_ORIGINS: https://${NGROK_DOMAIN}
      PUBLIC_BASE_URL: https://${NGROK_DOMAIN}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en BASE/app/.env}

  web:
    build:
      args:
        NEXT_PUBLIC_API_URL: ""

  ngrok:
    image: ngrok/ngrok:latest
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Define NGROK_AUTHTOKEN en BASE/app/.env}
    command:
      - http
      - --domain=${NGROK_DOMAIN:?Define NGROK_DOMAIN en BASE/app/.env}
      - web:3000
    ports:
      - "127.0.0.1:4040:4040"
    depends_on:
      - api
      - web